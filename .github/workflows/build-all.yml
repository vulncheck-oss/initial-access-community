name: Build All
on:
   workflow_dispatch:
   schedule:
     - cron: '0 0 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26.2'

    - uses: actions/cache@v5.0.4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install deps
      run: |
       sudo apt update
       sudo apt install -y gcc-mingw-w64 musl-dev musl-tools openjdk-11-jdk patchelf libssl-dev

    - name: Install golangci-lint
      run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.12.2

    - name: Build, Lint, and Test
      run: |
        (cd feed && ./make-all-lint.sh)
        (cd verification && ./test-all.sh)
